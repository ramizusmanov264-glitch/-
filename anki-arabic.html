<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Арабский — карточки как в Anki</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&display=swap">
<style>
:root{--bg:#faf8f4;--fg:#1f1d1a;--card:#fff;--mut:#6b665d;--acc:#1d6b57;--bd:#e3ded4;--again:#b3402f;--hard:#a8741a;--good:#1d6b57;--easy:#2a5fa8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151716;--fg:#ece8df;--card:#1f2221;--mut:#9a958a;--acc:#4cb597;--bd:#33383a;--again:#e07a68;--hard:#d8a24a;--good:#4cb597;--easy:#6ea3e6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151716;--fg:#ece8df;--card:#1f2221;--mut:#9a958a;--acc:#4cb597;--bd:#33383a;--again:#e07a68;--hard:#d8a24a;--good:#4cb597;--easy:#6ea3e6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
select,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
select{flex:1 1 140px;min-width:0}
.stats{display:flex;gap:16px;justify-content:center;color:var(--mut);font-size:14px;margin:8px 0 14px}
.stats b{color:var(--fg)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;min-height:260px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.ar{font-family:Amiri,"Noto Naskh Arabic","Traditional Arabic",serif;font-size:60px;line-height:1.5;direction:rtl}
.ru{font-size:30px}
.tr{font-size:20px;color:var(--acc)}
.n{font-size:13px;color:var(--mut)}
hr{width:60%;border:0;border-top:1px solid var(--bd);margin:6px 0}
.act{display:flex;gap:8px;margin-top:14px}
.act button{flex:1;padding:12px 4px;font-weight:600;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.act small{font-weight:400;color:var(--mut);font-size:12px}
#show{width:100%;margin-top:14px;padding:14px;background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
.sp{background:none;border:0;font-size:22px;padding:4px 10px;cursor:pointer}
.foot{margin-top:18px;display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.foot button{font-size:13px;padding:4px 10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;font-weight:600}.tabs .on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.grid button,#free{padding:14px 6px;font-weight:600}#free{width:100%}
.prog{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:4px 0}.prog i{display:block;height:100%;background:var(--acc)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;align-items:center;gap:10px;padding:14px;font-size:18px;border-radius:12px;text-align:left;width:100%}
.opt .ot{flex:1}.opt.aropt .ot{font-family:Amiri,"Noto Naskh Arabic",serif;font-size:30px;direction:rtl;text-align:center}
.k{color:var(--mut);font-size:13px;border:1px solid var(--bd);border-radius:6px;padding:0 6px}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 25%,var(--card))}
.opt.bad{border-color:var(--again);background:color-mix(in srgb,var(--again) 25%,var(--card))}
.m{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);width:100%;font-size:15px;text-align:left}
.m .a{font-family:Amiri,serif;font-size:22px;direction:rtl}
.big{font-size:48px;font-weight:700;color:var(--acc)}
summary{cursor:pointer;padding:10px 0;font-weight:600}
#hb{margin-top:6px;font-weight:600;padding:10px 14px}
</style>
</head>
<body>
<main>
  <select id="deck" aria-label="Словарь" style="width:100%;margin-bottom:10px"></select>

    <select id="lim" aria-label="Новых в день"><option>10</option><option>20</option><option>30</option><option>50</option><option>100</option></select>
  </div>
  <div class="stats"><span>К повторению: <b id="sd">0</b></span><span>Новых: <b id="sn">0</b></span><span>Изучено: <b id="sl">0</b></span></div>
  <div class="card" id="card"></div>
  <div id="ctl"></div>
  <div class="foot"><span>Пробел — показать ответ · 1–4 — оценка</span><button id="rst">Сбросить прогресс</button></div>
  </section>
  <section id="t-q" hidden><div id="q"></div></section>
  <section id="t-s" hidden></section>
</main>

function fmt(ms){
  const m=Math.round(ms/M);
  if(m<60)return m+" мин";
  const d=Math.round(ms/D);
  if(d<1)return Math.round(m/60)+" ч";
  if(d<30)return d+" д";
  if(d<365)return Math.round(d/30)+" мес";
  return (d/365).toFixed(1).replace(".",",")+" г";
}
function sched(s,q){
  s=s||{ivl:0,ease:2.5,reps:0,lapses:0};
  let {ivl,ease,reps,lapses}=s,due;
  if(ivl===0){
    if(q===0)due=M;else if(q===1)due=5*M;
    else{ivl=q===2?1:4;due=ivl*D}
  }else if(q===0){
    ease=Math.max(1.3,ease-.2);lapses++;ivl=0;due=10*M;
  }else{
    const h=Math.max(1,Math.round(ivl*1.2));
    const g=Math.max(h+1,Math.round(ivl*ease));
    const e=Math.max(g+1,Math.round(ivl*ease*1.3));
    if(q===1){ease=Math.max(1.3,ease-.15);ivl=h}
    else if(q===2)ivl=g;
    else{ease+=.15;ivl=e}
    due=ivl*D;
  }
  return {ivl,ease,reps:reps+1,lapses,due:Date.now()+due,wait:due};
}

function pick(){
  const now=Date.now(),p=pool();
  const due=p.filter(w=>{const s=S.c[key(w)];return s&&s.due<=now}).sort((a,b)=>S.c[key(a)].due-S.c[key(b)].due);
  const fresh=p.filter(w=>!S.c[key(w)]);
  const allow=Math.max(0,S.lim-S.nd.n);
  const learned=p.filter(w=>S.c[key(w)]).length;
  const stats={d:due.length,n:Math.min(fresh.length,allow),l:learned};
  const card=due[0]||(allow>0?fresh[0]:null)||null;
  return {card,stats,fresh:fresh.length};
}

function rate(q){
  if(!cur)return;
  const k=key(cur),was=S.c[k];
  const n=sched(was,q);delete n.wait;
  S.c[k]=n;wst(cur[0],q>=2);
  if(!was){if(S.nd.d!==today())S.nd={d:today(),n:0};S.nd.n++}
  save();next();
}

    if(AC.state==="suspended")AC.resume();
    const n=AC.currentTime;
    (ok?[[660,0],[880,.09]]:[[220,0],[165,.12]]).forEach(([f,t])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type="sine";o.frequency.value=f;
      g.gain.setValueAtTime(0,n+t);g.gain.linearRampToValueAtTime(.05,n+t+.02);g.gain.exponentialRampToValueAtTime(.0001,n+t+.22);
      o.connect(g);g.connect(AC.destination);o.start(n+t);o.stop(n+t+.25);
    });
  }catch(e){}
}
function qkey(e){
  if(tab!=="q"||!Q||!Q.w)return;
  if(!Q.done&&e.key.length===1&&"1234".includes(e.key))qans(+e.key-1);
  else if(Q.done&&(e.key===" "||e.key==="Enter")&&$("nx")){e.preventDefault();qnext()}
}
function qend(){
  clearTimeout(Q.t);
  const {n,i,ok,bad}=Q;Q.w=null;
  if(i){S.h.unshift({t:Date.now(),n,i,ok,d:Q.dir});S.h=S.h.slice(0,100);save()}
  const p=i?Math.round(ok/i*100):0;
  $("q").innerHTML=`<div class="card"><div class="n">${n?"Марафон "+n:"Свободная практика"} завершён</div><div class="big">${p}%</div><div>Верно ${ok} из ${i}</div>
  ${bad.length?`<hr><div class="n">Ошибки (${bad.length})</div>`+bad.map(w=>`<div class="m"><span class="a">${w[1]}</span><span>${w[2]} — ${w[3]}</span></div>`).join(""):"<div>Без единой ошибки! 🎉</div>"}</div>
  <div class="act">${n&&!Q.hard?`<button id="again">Новый набор на ${n}</button>`:""}<button id="menu">В меню</button></div>`;
  if(n&&!Q.hard)$("again").onclick=()=>qstart(n);
  $("menu").onclick=qmenu;
}
next();
</script>
